{% load static %}
<header class="main-header">
    <nav class="topbar">
        <div class="left-side">
            <a href="/" class="img-link">
                <img src="{% static 'images/logo.png' %}" alt="Logo" class="nav-logo-img">
            </a>
            <a href="/" class="logo-link">
                <h1 class="logo">Readify</h1>
            </a>
            <a href="/about/" class="about-link">About Us</a>
        </div>

        <div class="right-side" id="auth-buttons">
            <a href="/login/" class="btn btn-login">LogIn</a>
            <a href="/signup/" class="btn btn-signup">SignUp</a>
        </div>
    </nav>

    <nav class="navbar">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/borrow/">Borrow Book</a></li>
            <li><a href="/search/">Search</a></li>
            <li><a href="/books/add/">Add Book</a></li>
            <li><a href="/books/">View Books</a></li>

            <!-- ✅ Borrowed Books page -->
            <li><a href="/borrow/borrowed-books/">Borrowed Books</a></li>
        </ul>
    </nav>
</header>

<script>
(function() {
    const token = localStorage.getItem('token') || localStorage.getItem('access_token');
    const authButtons = document.getElementById('auth-buttons');

    if (token && token !== 'undefined' && token !== 'null') {
        try {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const username = user.username || 'User';
            const isAdmin = user.is_admin || user.is_staff || false;

            authButtons.innerHTML = `
                <span class="user-greeting">Hello, ${username} ${isAdmin ? '(Admin)' : ''}</span>
                <a href="#" onclick="logout(); return false;" class="btn btn-login">Logout</a>
            `;
        } catch (e) {
            console.error('Error parsing user data:', e);
        }
    }

    window.logout = function() {
        if (confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/login/';
        }
    };
})();
</script>
