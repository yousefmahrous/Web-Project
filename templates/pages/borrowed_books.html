{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Borrowed Books</title>

    <link rel="shortcut icon" href="{% static 'images/logo.png' %}" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/borrowed.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
</head>

<body>

    {% include "includes/navbar.html" %}

    <main>
        <section class="user-panel-card">
            <h2 id="panel-title">User Panel</h2>
            <p>Welcome, <strong id="username">User</strong></p>
        </section>

        <section class="books-card">
            <h2>Borrowed Books</h2>
            <details open>
                <summary>View Your List</summary>

                <ul id="Borrowed-Books">
                    <!-- Data will be loaded from API -->
                </ul>

            </details>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Knowledge Library. All rights reserved.</p>
    </footer>

    <script src="{% static 'js/borrowed.js' %}"></script>

</body>
</html>
