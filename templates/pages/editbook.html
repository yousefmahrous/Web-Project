{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/editbook.css' %}">
    <link rel="icon" type="image/png" href="{% static 'imgs/logo.png' %}">
    <title>Edit Book</title>
    <base target="_blank">
<base target="_blank">
</head>
<body>
    {% include 'includes/navbar.html' %}

    <section class="container">
        <div class="wrapper">
            <h1>Edit Book</h1>
            <p id="loading-msg" class="loading">Loading book data...</p>

            <!-- Book Info Panel -->
            <div id="book-info" class="book-info-panel" style="display: none;">
                <div class="info-row">
                    <span class="info-label">Created:</span>
                    <span id="created-at" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Created by:</span>
                    <span id="created-by" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Last updated:</span>
                    <span id="updated-at" class="info-value">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Updated by:</span>
                    <span id="updated-by" class="info-value">-</span>
                </div>
            </div>

            <form id="editForm" style="display: none;" enctype="multipart/form-data">
                <div>
                    <label for="bookid">Book ID</label>
                    <input type="number" id="bookid" name="bookid" readonly>
                </div>
                <div>
                    <label for="bookname">Book Name <span style="color: #e70606;">*</span></label>
                    <input type="text" id="bookname" name="title" placeholder="Book Name">
                </div>
                <div>
                    <label for="author">Author <span style="color: #e70606;">*</span></label>
                    <input type="text" id="author" name="author" placeholder="Author Name">
                </div>
                <div>
                    <label for="category">Category <span style="color: #e70606;">*</span></label>
                    <select id="category" name="category">
                        <option value="" disabled selected>Select Category</option>
                        <option value="fiction">Fiction</option>
                        <option value="nonfiction">Non-Fiction</option>
                        <option value="religious">Religious</option>
                        <option value="science">Science</option>
                        <option value="history">History</option>
                        <option value="technology">Technology</option>
                        <option value="biography">Biography</option>
                        <option value="children">Children</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="description">Description <span style="color: #e70606;">*</span></label>
                    <textarea id="description" name="description" placeholder="Book Description (min 10 characters)" rows="4"></textarea>
                </div>
                <div>
                    <label for="image">Book Cover <span style="color: #777; font-size: 12px;">(Optional)</span></label>
                    <input type="file" id="image" name="image" accept="image/*">
                    <div id="current-image-container" style="margin-top: 10px; display: none;">
                        <p style="font-size: 12px; color: #666;">Current cover:</p>
                        <img id="current-image" src="" alt="Current cover" style="max-width: 150px; border-radius: 8px; margin-top: 5px;">
                    </div>
                </div>
                <div class="button-group">
                    <button type="submit" id="saveBtn">Save Changes</button>
                    <button type="button" id="cancelButton">Cancel</button>
                </div>
            </form>

            <hr>

            <form id="deleteForm">
                <input type="hidden" name="bookid">
                <button type="submit" class="btn-danger">Delete Book</button>
            </form>
        </div>
    </section>

    <script src="{% static 'js/editbook.js' %}"></script>
</body>
</html>
